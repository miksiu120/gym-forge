<div class="container">
    <div class="side-bar">
        <div class="shadow"></div>
        <h2 class="title">
            JOIN TODAY TO OUR COMMUNITY
        </h2>
    </div>
    <div class="register">
        <div class="register__text">
            <h3 class="register__title">
                Sign up
            </h3>
            <p class="register__description">
                Create an account to get started today.
            </p>
        </div>
        <form [formGroup]="registerForm" (ngSubmit)="register()">
            <div class="error error--form" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
            <div class="success" *ngIf="successMessage" role="status">{{ successMessage }}</div>

            <div class="form-group">
                <label for="nickname" class="required"> Nickname</label>
                <input type="text" id="nickname" name="nickame" formControlName="nickname" required>
            </div>

            <div class="form-group">
                <label for="email" class="required"> Email </label>
                <input formControlName="email" type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="name">First Name</label>
                <input formControlName="name" type="text" id="name" name="name">
            </div>
            <div class="form-group">
                <label for="surname">Last Name</label>
                <input formControlName="surname" type="text" id="surname" name="surname">
            </div>

            <div class="form-group">
                <label for="password" class="required">Password</label>
                <input type="password" id="password" formControlName="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword" class="required">Confirm Password</label>
                <input type="password" id="confirmPassword" formControlName="confirmPassword" name=" confirmPassword"
                    required>
            </div>
            <button class="btn btn-register" type="submit" [disabled]="submitting">{{ submitting ? 'Creating account...' : 'Register' }}</button>
            <p class="question">Already have an account?</p>
            <a routerLinkActive="active" routerLink="/login" class="btn btn-login">login</a>
        </form>

    </div>
</div>
