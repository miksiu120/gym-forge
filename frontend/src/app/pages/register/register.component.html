<div class="container">
    <div class="side-bar">
        <div class="shadow"></div>
        <h2 class="title">
            JOIN TODAY TO OUR COMMUNITY
        </h2>
    </div>
    <div class="register">
        <div class="register__text">
            <h3 class="register__title">
                Sign up
            </h3>
            <p class="register__description">
                Create an account to get started today.
            </p>
        </div>
        <form action="">

            <div class="form-group">
                <label for="nickname"> Nickname</label>
                <input type="text" id="nickname" name="nickame" required>
            </div>

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName">
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName">
            </div>

            <div class="form-group">
                <label for="birthday"> Birthday</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button class="btn btn-register" type="submit">Register</button>
            <p class="question">Already have an account?</p>
            <a routerLinkActive="active" routerLink="/login" class="btn btn-login">login</a>
        </form>

    </div>
</div>
