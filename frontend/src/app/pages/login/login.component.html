<div class="container">
    <div class="side-bar">
        <div class="shadow"></div>
        <h2 class="title">
            WELCOME BACK
        </h2>
        <p class="description">Have a nice training! You're the best!</p>
    </div>
    <div class="login">
        <div class="login__text">
            <h3 class="login__title">
                Sign in
            </h3>
            <p class="login__description">
                Please enter your credentials to log in.
            </p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="error error--form" *ngIf="errorMessage" role="alert">{{ errorMessage }}</div>
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" formControlName="nickname">
                <div class="error" *ngIf="hasError('nickname', 'required')">
                    Nickname is required.
                </div>
           
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password">
                <div class="error" *ngIf="hasError('password', 'required')">
                    Password is required.
                </div>            
            </div>
            <button class="btn btn-login" type="submit" [disabled]="submitting">{{ submitting ? 'Signing in...' : 'Login' }}</button>
            <p class="question">Don't have an account?</p>
            <a routerLink="/register" class="btn btn-login">Register</a>
        </form>
    </div>
</div>
