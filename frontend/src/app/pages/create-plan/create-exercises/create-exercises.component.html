<div class="form-box box">
    <h2 class="box__title box__title--dark"> Create exercise </h2>


    <form action="">

        <div class="form-group exercise-name">
            <label for="exercise-name"> Exercise name</label>
            <input type="text" id="exercise-name" name="exercise-name" formControlName="exercise-name">
        </div>

        <div class="form-group exercise-description">
            <label for="exercise-description"> Exercise description</label>
            <textarea id="exercise-description" maxlength="150" name="exercise-description"
                formControlName="exercise-description">
    </textarea>
        </div>

        <div class="form-group sets">
            <label for="exercise-name"> Sets</label>
            <input type="number" id="sets" name="sets" formControlName="sets">
        </div>

        <div class="form-group">
            <label for="exercise-type">Exercise type</label>
            <div>
                <input class="radio" type="radio" id="repetetive" name="exercise-type" value="repetetive"
                    formControlName="repetetive" checked>
                <label for="repetetive">Repetitive</label>
            </div>
            <div>
                <input class="radio" type="radio" id="timed" name="exercise-type" value="timed" formControlName="timed">
                <label for="timed">Timed</label>
            </div>
        </div>


        <div class="form-group repetitions">
            <label for="exercise-name"> repetitions</label>
            <input type="number" id="repetitions" name="repetitions" formControlName="repetitions">
        </div>

        <!-- <div class="form-group duration">
        <label for="exercise-name"> duration</label>
        <input type="number" id="duration" name="duration" formControlName="duration">
    </div> -->
        <button class="form-group btn"> Save </button>
    </form>

</div>

<div class="box ">
    <h2 class="box__title box__title--dark"> Your exercises </h2>


</div>
