<div class="large-container">
    <div class="small-container">
        <div class="box">
            <h2 class="box__title">Edit your profile</h2>

            <form>
                <div class="picture-edit edit-area">
                    <img src="./default-profile.jpg" alt="profile">
                    <div class="form-group">
                        <label for="profile-picture"> Upload photo</label>
                        <input type="file" id="profile-picture" name="profile-picture"
                            formControlName="profile-picture">
                    </div>
                </div>

                <div class="edit-area form-group">
                    <label for="nickname"> Nickname</label>
                    <input type="text" id="nickname" name="nickname" formControlName="nickname"
                        [value]="accountDetails.nickname">
                </div>

                <div class="edit-area form-group">
                    <label for="email"> Email</label>
                    <input type="text" id="email" name="email" formControlName="email" [value]="accountDetails.email">
                </div>

                <div class="edit-area form-group">
                    <label for="name"> Name</label>
                    <input type="text" id="name" name="name" formControlName="name" [value]="accountDetails.name">
                </div>

                <div class="edit-area form-group">
                    <label for="surname"> Surname</label>
                    <input type="text" id="surname" name="surname" formControlName="surname"
                        [value]="accountDetails.surname">
                </div>

                <div class="edit-area form-group">
                    <label for="birthday"> Birthday</label>
                    <input type="date" id="birthday" name="birthday" formControlName="birthday"
                        [value]="accountDetails.birthDay">
                </div>

                <div class="edit-area form-group">
                    <label for="weight"> Weight</label>
                    <input type="number" id="weight" name="weight" formControlName="weight"
                        [value]="accountDetails.weight">
                </div>

                <div class="edit-area form-group">
                    <label for="height"> Height</label>
                    <input type="number" id="height" name="height" formControlName="height"
                        [value]="accountDetails.height">
                </div>

                <div class="edit-area form-group">
                    <label for="measure-type">Measure System</label>
                    <div>
                        <input class="radio" type="radio" id="metric" name="measure-type" value="metric"
                            formControlName="measure-type" [checked]="accountDetails.measurementSystem === 'metric'">
                        <label for="metric">Metric</label>
                    </div>
                    <div>
                        <input class="radio" type="radio" id="imperial" name="measure-type" value="imperial"
                            formControlName="measure-type" [checked]="accountDetails.measurementSystem === 'imperial'">
                        <label for="imperial">Imperial</label>
                    </div>
                </div>

                <div class="edit-area form-group">
                    <label for="about-you"> About you</label>
                    <textarea id="about-you" maxlength="150" name="about-you" formControlName="about-you">
                    {{accountDetails.description}}
                </textarea>
                </div>

                <button class="edit-area form-group btn"> Save </button>

                <a routerLinkActive="active" routerLink="/profile" class="edit-area form-group btn">Discard</a>
            </form>
        </div>
    </div>
</div>
